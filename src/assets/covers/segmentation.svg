<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/><stop offset="1" stop-color="#0b1d3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".36"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3b82f6" stroke-opacity=".10"/>
    </pattern>
    <pattern id="bricks" width="40" height="24" patternUnits="userSpaceOnUse">
      <rect width="40" height="24" fill="#0f1d38"/>
      <path d="M0 12H40M0 24H40M20 0V12M0 12V24M40 12V24" stroke="#2f5da8" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1d38"/><stop offset="1" stop-color="#0a1326"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 10 5 0 10 3 5z" fill="#7cb4ff"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="315" rx="540" ry="270" fill="url(#glow)"/>

  <!-- Internet -->
  <g fill="none" stroke="#7cb4ff" stroke-width="2.5">
    <circle cx="120" cy="315" r="52"/>
    <ellipse cx="120" cy="315" rx="22" ry="52"/>
    <path d="M68 315H172M76 290H164M76 340H164"/>
  </g>
  <text x="120" y="400" fill="#8ea3c2" font-size="16" text-anchor="middle" letter-spacing="2">INTERNET</text>
  <path d="M176 315H286" stroke="#7cb4ff" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>

  <!-- DMZ zone -->
  <rect x="292" y="196" width="226" height="238" rx="22" fill="#060a11" fill-opacity=".75" stroke="#60a5fa" stroke-opacity=".8" stroke-width="2.5" stroke-dasharray="12 9"/>
  <rect x="314" y="182" width="78" height="28" rx="14" fill="#0b1426" stroke="#2a4a7f"/>
  <text x="353" y="201" fill="#9db4d3" font-size="14" letter-spacing="2" text-anchor="middle">DMZ</text>
  <rect x="314" y="268" width="182" height="94" rx="16" fill="url(#card)" stroke="#2f5da8" stroke-width="1.5"/>
  <text x="334" y="308" fill="#eef4ff" font-size="21" font-weight="700">Edge / VPN</text>
  <text x="334" y="336" fill="#8ea3c2" font-size="14">unpatched CVE</text>
  <circle cx="474" cy="290" r="7" fill="#f59e0b" filter="url(#soft)"/>

  <!-- paths from the edge device -->
  <g stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M498 300 C532 300 534 170 552 170" stroke="#7cb4ff" stroke-opacity=".55" stroke-dasharray="2 8"/>
    <path d="M498 330 C532 330 534 460 552 460" stroke="#7cb4ff" stroke-opacity=".55" stroke-dasharray="2 8"/>
    <path d="M498 315 H642" stroke="#7cb4ff" marker-end="url(#arrow)"/>
  </g>

  <!-- firewall wall -->
  <rect x="560" y="110" width="40" height="410" rx="6" fill="url(#bricks)" stroke="#3b82f6" stroke-width="2"/>
  <text x="580" y="556" fill="#8ea3c2" font-size="14" text-anchor="middle" letter-spacing="2">FIREWALL</text>
  <!-- blocked marks -->
  <g stroke="#f87171" stroke-width="4" stroke-linecap="round">
    <path d="M571 159 593 181M593 159 571 181"/>
    <path d="M571 449 593 471M593 449 571 471"/>
  </g>
  <!-- allowed port label -->
  <rect x="604" y="278" width="42" height="22" rx="11" fill="#0b1426" stroke="#2a4a7f"/>
  <text x="625" y="294" fill="#9db4d3" font-size="13" text-anchor="middle">443</text>

  <!-- internal zones -->
  <g fill="url(#card)" stroke="#2f5da8" stroke-width="1.5">
    <rect x="650" y="122" width="290" height="96" rx="16"/>
    <rect x="650" y="267" width="290" height="96" rx="16"/>
    <rect x="650" y="412" width="290" height="96" rx="16"/>
  </g>
  <g fill="#0d1b33" stroke="#2f5da8" stroke-width="1.5">
    <circle cx="694" cy="170" r="24"/><circle cx="694" cy="315" r="24"/><circle cx="694" cy="460" r="24"/>
  </g>
  <g fill="none" stroke="#7cb4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- clients: monitor -->
    <g transform="translate(682 158)"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></g>
    <!-- servers: stacked units -->
    <g transform="translate(682 303)"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></g>
    <!-- admin: shield -->
    <g transform="translate(682 448)"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></g>
  </g>
  <g fill="#eef4ff" font-size="21" font-weight="700">
    <text x="734" y="164">Clients</text>
    <text x="734" y="309">Servers</text>
    <text x="734" y="454">Admin</text>
  </g>
  <g fill="#8ea3c2" font-size="14">
    <text x="734" y="190">workstations</text>
    <text x="734" y="335">internal apps</text>
    <text x="734" y="480">PAW · mgmt VLAN</text>
  </g>

  <!-- logging -->
  <g stroke="#7cb4ff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round" fill="none">
    <path d="M942 170 C975 170 978 280 1000 280"/>
    <path d="M942 315 H1000"/>
    <path d="M942 460 C975 460 978 350 1000 350"/>
  </g>
  <rect x="1004" y="235" width="160" height="160" rx="16" fill="url(#card)" stroke="#3b82f6" stroke-width="2"/>
  <g transform="translate(1062 262) scale(1.8)" fill="none" stroke="#7cb4ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
  </g>
  <text x="1084" y="345" fill="#eef4ff" font-size="20" font-weight="700" text-anchor="middle">Logged</text>
  <text x="1084" y="370" fill="#8ea3c2" font-size="13" text-anchor="middle">east-west flows</text>
</svg>

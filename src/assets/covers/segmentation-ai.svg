<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/><stop offset="1" stop-color="#0b1d3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".34"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3b82f6" stroke-opacity=".10"/>
    </pattern>
    <pattern id="bricks" width="28" height="16" patternUnits="userSpaceOnUse">
      <rect width="28" height="16" fill="#0f1d38"/>
      <path d="M0 8H28M0 16H28M14 0V8M0 8V16M28 8V16" stroke="#2f5da8" stroke-width="1.3"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1d38"/><stop offset="1" stop-color="#0a1326"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 10 5 0 10 3 5z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="315" rx="560" ry="280" fill="url(#glow)"/>

  <!-- ============ LEFT: time to exploit ============ -->
  <rect x="64" y="104" width="214" height="30" rx="15" fill="#0b1426" stroke="#2a4a7f"/>
  <text x="171" y="124" fill="#9db4d3" font-size="14" letter-spacing="2" text-anchor="middle">TIME TO EXPLOIT</text>

  <!-- axis = day 0 -->
  <line x1="250" y1="160" x2="250" y2="398" stroke="#3b5b8f" stroke-width="2"/>
  <text x="250" y="420" fill="#5f7799" font-size="12" text-anchor="middle">day 0</text>

  <g fill="#8ea3c2" font-size="15">
    <text x="64" y="195">2018–19</text>
    <text x="64" y="255">2021–22</text>
    <text x="64" y="315">2023</text>
    <text x="64" y="375">2026 est.</text>
  </g>
  <!-- bars: 4px per day -->
  <rect x="250" y="177" width="252" height="26" rx="5" fill="url(#bar)"/>
  <rect x="250" y="237" width="128" height="26" rx="5" fill="url(#bar)"/>
  <rect x="250" y="297" width="20" height="26" rx="5" fill="url(#bar)"/>
  <rect x="222" y="357" width="28" height="26" rx="5" fill="#f59e0b" filter="url(#soft)"/>
  <g font-size="15" font-weight="700">
    <text x="512" y="195" fill="#eef4ff">63d</text>
    <text x="388" y="255" fill="#eef4ff">32d</text>
    <text x="280" y="315" fill="#eef4ff">5d</text>
    <text x="262" y="375" fill="#f59e0b">−7d</text>
  </g>

  <!-- AI chip -->
  <g transform="translate(64 452)">
    <rect x="0" y="0" width="64" height="64" rx="12" fill="#0d1b33" stroke="#f59e0b" stroke-width="2"/>
    <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round">
      <path d="M18 -8V0M32 -8V0M46 -8V0M18 64V72M32 64V72M46 64V72M-8 18H0M-8 32H0M-8 46H0M64 18H72M64 32H72M64 46H72"/>
    </g>
    <text x="32" y="40" fill="#f59e0b" font-size="22" font-weight="700" text-anchor="middle">AI</text>
  </g>
  <text x="148" y="478" fill="#eef4ff" font-size="18" font-weight="700">faster discovery,</text>
  <text x="148" y="502" fill="#eef4ff" font-size="18" font-weight="700">faster exploits</text>

  <!-- exploit path into the network -->
  <path d="M340 492 C 470 492 520 230 606 214" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="2 8" marker-end="url(#arrowAmber)"/>

  <!-- ============ RIGHT: segmented network ============ -->
  <!-- zones -->
  <g fill="#060a11" fill-opacity=".78" stroke="#60a5fa" stroke-opacity=".8" stroke-width="2.5" stroke-dasharray="12 9">
    <rect x="620" y="120" width="244" height="178" rx="20"/>
    <rect x="908" y="120" width="244" height="178" rx="20"/>
    <rect x="620" y="342" width="244" height="178" rx="20"/>
    <rect x="908" y="342" width="244" height="178" rx="20"/>
  </g>

  <!-- firewall cross -->
  <rect x="872" y="104" width="28" height="432" rx="5" fill="url(#bricks)" stroke="#3b82f6" stroke-width="2"/>
  <rect x="604" y="306" width="564" height="28" rx="5" fill="url(#bricks)" stroke="#3b82f6" stroke-width="2"/>
  <rect x="872" y="306" width="28" height="28" fill="url(#bricks)"/>

  <!-- icon badges -->
  <g fill="#0d1b33" stroke="#2f5da8" stroke-width="1.5">
    <circle cx="672" cy="209" r="24"/><circle cx="960" cy="209" r="24"/>
    <circle cx="672" cy="431" r="24"/><circle cx="960" cy="431" r="24"/>
  </g>
  <g fill="none" stroke="#7cb4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- DMZ: globe -->
    <g transform="translate(660 197)"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></g>
    <!-- Clients: monitor -->
    <g transform="translate(948 197)"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></g>
    <!-- Servers: stacked units -->
    <g transform="translate(660 419)"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></g>
    <!-- Admin: shield -->
    <g transform="translate(948 419)"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></g>
  </g>

  <g fill="#eef4ff" font-size="22" font-weight="700">
    <text x="712" y="204">DMZ</text>
    <text x="1000" y="204">Clients</text>
    <text x="712" y="426">Servers</text>
    <text x="1000" y="426">Admin</text>
  </g>
  <g font-size="14">
    <text x="712" y="229" fill="#f5b544">edge · exploited</text>
    <text x="1000" y="229" fill="#8ea3c2">contained</text>
    <text x="712" y="451" fill="#8ea3c2">contained</text>
    <text x="1000" y="451" fill="#8ea3c2">contained</text>
  </g>

  <!-- compromised marker -->
  <circle cx="836" cy="148" r="7" fill="#f59e0b" filter="url(#soft)"/>

  <!-- small locks on intact zones -->
  <g fill="none" stroke="#7cb4ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(1116 136)"><rect x="3" y="10" width="16" height="11" rx="2"/><path d="M7 10V7a4 4 0 0 1 8 0v3"/></g>
    <g transform="translate(828 358)"><rect x="3" y="10" width="16" height="11" rx="2"/><path d="M7 10V7a4 4 0 0 1 8 0v3"/></g>
    <g transform="translate(1116 358)"><rect x="3" y="10" width="16" height="11" rx="2"/><path d="M7 10V7a4 4 0 0 1 8 0v3"/></g>
  </g>

  <!-- blocked lateral movement -->
  <g stroke="#f59e0b" stroke-opacity=".7" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="2 7">
    <path d="M800 260 H864"/>
    <path d="M760 262 V300"/>
  </g>
  <g stroke="#f87171" stroke-width="4" stroke-linecap="round">
    <path d="M876 250 896 270M896 250 876 270"/>
    <path d="M750 310 770 330M770 310 750 330"/>
  </g>
</svg>

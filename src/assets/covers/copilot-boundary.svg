<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="ui-monospace, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/><stop offset="1" stop-color="#0b1d3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".4"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3b82f6" stroke-opacity=".12"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="400" cy="315" r="340" fill="url(#glow)"/>

  <!-- tenant / EU Data Boundary -->
  <rect x="110" y="130" width="440" height="370" rx="22" fill="#070b12" stroke="#60a5fa" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="140" y="175" fill="#8a97ab" font-size="20" letter-spacing="2">EU DATA BOUNDARY</text>
  <g fill="#0a1426" stroke="#3b82f6" stroke-width="2">
    <rect x="150" y="215" width="170" height="64" rx="10"/>
    <rect x="150" y="305" width="170" height="64" rx="10"/>
    <rect x="150" y="395" width="170" height="64" rx="10"/>
  </g>
  <g fill="#e6edf7" font-size="20">
    <text x="176" y="254">Mail</text><text x="176" y="344">Files</text><text x="176" y="434">Chats</text>
  </g>
  <circle cx="465" cy="340" r="46" fill="#0a1426" stroke="#60a5fa" stroke-width="4"/>
  <text x="465" y="347" fill="#60a5fa" font-size="22" text-anchor="middle" font-weight="700">LLM</text>
  <path d="M320 247 L415 320 M320 337 L415 340 M320 427 L415 362" stroke="#3b82f6" stroke-opacity=".6" stroke-width="2" fill="none"/>

  <!-- arrows out of the boundary -->
  <path d="M510 320 C640 260 740 230 820 215" stroke="#60a5fa" stroke-width="4" fill="none" stroke-dasharray="3 9" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M510 360 C640 420 740 440 820 450" stroke="#60a5fa" stroke-width="4" fill="none" stroke-dasharray="3 9" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g>
    <rect x="830" y="170" width="290" height="90" rx="14" fill="#0a1426" stroke="#3b82f6" stroke-width="2"/>
    <text x="855" y="208" fill="#e6edf7" font-size="22" font-weight="700">Flex Routing</text>
    <text x="855" y="238" fill="#8a97ab" font-size="18">US · CA · AU</text>
    <rect x="830" y="405" width="290" height="90" rx="14" fill="#0a1426" stroke="#3b82f6" stroke-width="2"/>
    <text x="855" y="443" fill="#e6edf7" font-size="22" font-weight="700">Anthropic</text>
    <text x="855" y="473" fill="#8a97ab" font-size="18">subprocessor</text>
  </g>
</svg>
